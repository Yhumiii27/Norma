name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: RESTE-A-FAIRE.md à jour
        run: npm run reste-a-faire && git diff --exit-code RESTE-A-FAIRE.md
